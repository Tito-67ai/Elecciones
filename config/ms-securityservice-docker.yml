server:
  port: 8080

spring:
  application:
    name: ms-securityservice

  datasource:
    url: jdbc:h2:mem:securitydb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka/

  instance:
    lease-renewal-interval-in-seconds: 10
