gateway:
  internal-secret: "EleccionesClaveInternaGateway2026"

jwt:
  secret: "EleccionesClaveJwtSuperSecreta2026ParaFirmaHS256"
  expiration: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    root: INFO
    org.springframework.web: DEBUG