name: CI/CD Pipeline

on:
  push:
    branches: [backend, main]
  pull_request:
    branches: [backend, main]

env:
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository"
  JAVA_VERSION: '17'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      rabbitmq:
        image: rabbitmq:3.12-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build all modules
        run: |
          set -e
          for pom in ms-*/ms-*/pom.xml; do
            echo "::group::Compile $pom"
            mvn -B -f "$pom" clean compile -DskipTests
            echo "::endgroup::"
          done

      - name: Run unit tests
        run: |
          set -e
          for pom in ms-*/ms-*/pom.xml; do
            echo "::group::Tests $pom"
            mvn -B -f "$pom" test
            echo "::endgroup::"
          done

      - name: Run integration tests
        run: |
          set -e
          for pom in ms-*/ms-*/pom.xml; do
            echo "::group::Verify $pom"
            mvn -B -f "$pom" verify -DskipITs=false
            echo "::endgroup::"
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports

  docker-build:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          SERVICES="ms-registry ms-config-server ms-gateway ms-securityservice ms-patron ms-votacion"
          for svc in $SERVICES; do
            echo "Building $svc..."
            docker build -t ghcr.io/${{ github.repository_owner }}/elecciones-${svc}:${IMAGE_TAG} ./${svc}/${svc}
            docker push ghcr.io/${{ github.repository_owner }}/elecciones-${svc}:${IMAGE_TAG}
          done

  deploy-staging:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment (kubectl/helm/ssh)..."
          # kubectl apply -f k8s/staging/
          # or ssh user@staging "docker compose pull && docker compose up -d"
