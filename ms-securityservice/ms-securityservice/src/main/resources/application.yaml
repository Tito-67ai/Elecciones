spring:
  application:
    name: ms-securityservice
  profiles:
    default: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

---
spring:
  config:
    activate:
      on-profile: dev
    import: "configserver:http://localhost:8888"

---
spring:
  config:
    activate:
      on-profile: docker
    import: "configserver:http://configserver:8888"
